services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bizplay-classifier-ui
    ports:
      - "9009:9009"
    environment:
      NODE_ENV: production
      BACKEND_URL: ${UI_BACKEND_URL:-http://host.docker.internal:9008/api/v1}
      AUTH_SECRET: ${UI_AUTH_SECRET:-change-me-in-production}
      AUTH_URL: ${UI_AUTH_URL:-http://localhost:9009}
    env_file:
      - path: .env.production
        required: false
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - bizplay-network

networks:
  bizplay-network:
    driver: bridge

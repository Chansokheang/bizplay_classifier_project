# BizPlay cloud API endpoint templates (the provider's API contract).
#
# These are PATHS ONLY — the base URL and the {productCode}/{receiptProductCode} segments come
# from app.bizplay.* (BizplayProperties), and query strings are assembled in the gateway. Path
# variables use {name} and are substituted by BizplayGatewayServiceImple.expand(...).
#
# Bound into BizplayEndpoints (@ConfigurationProperties prefix "bizplay.endpoints"), loaded via
# @PropertySource + YamlPropertySourceFactory. The Java class carries the same values as defaults,
# so the app still starts if this file is absent — edit here to re-point a path without a rebuild.
bizplay:
  endpoints:
    # ① purpose catalog (purposes + segments) for a corporation user
    purpose-catalog: /api/v2/bstrPurpose/corporation-user/{corpUserId}/{paperKindType}
    # ② paper (form) definitions for a purpose — untyped discovery, then the typed variant
    papers: /api/v2/paper/purpose/{purposeId}
    papers-typed: /api/v2/paper/purpose/{bstrType}/{purposeId}
    # corporation staff roster / one staff member
    corporation-users: /api/v2/popup/user/all/{corporationId}
    user: /api/v2/eacc-user/{corporationUserId}
    # ③ plan draft save  /  ⑦ settlement draft save (SEPARATE endpoints, per body shape)
    plan-draft: /api/v2/approval/{productCode}/bstr/plan/draft
    settlement-draft: /api/v2/approval/{productCode}/bstr/report/draft
    # ④ plan list (settlement anchor search)  /  ⑤ one plan's detail
    # Product-scoped on purpose: this path HONOURS startDate/endDate + searchPeriodType and
    # populates usageCnt; the unscoped /approval/bstr/plan/list does neither. Literal 'seah'
    # (not {productCode}) — bics 500s here. Provider answer 260810, 1-4/1-5.
    plan-list: /api/v2/approval/seah/bstr/plan/list
    # ④b plan list, UNSCOPED — the only path that returns DRAFTED (not-yet-approved) plans.
    # The seah path above returns APPROVED rows only, so it can never answer "which of my
    # requests is still waiting for approval?". Trade-offs of this path, handled in the gateway
    # /agent: it IGNORES startDate/endDate (filter client-side), leaves usageCnt null, and
    # repeats a plan once per approval line - so rows must be deduped by approvalId.
    pending-plan-list: /api/v2/approval/bstr/plan/list
    # ⑨ settlement (출장정산서) LIST — POST with a JSON filter, streaming JSON response.
    settlement-list: /api/v2/approval/seah/bstr/all/list/streaming
    plan-detail: /api/v2/approval/bstr/{approvalId}
    # ⑥ unattached card receipts (settlement evidence)
    receipt-stream: /api/v2/receipt/{receiptProductCode}/not-attached/stream
    # ⑧ manual expense entry (when no card receipt exists): create → upload image → issued detail
    etc-card: /api/v2/receipt/etc-card
    filebox-upload: /api/v2/filebox/upload
    issued-bulk: /api/v2/receipt/issued/bulk/{ids}
    # optional: additional receipt detail (travel info) — PATCH after etc-card create
    receipt-etc-detail: /api/v2/receipt-etc/{receiptId}
    # TranKind master (id → name/type), to resolve the plan's allowed tranKinds
    trankind-list: /api/v2/trankind/list
    # who the bearer token belongs to - name, corporationUserId, department, corporations
    user-profile: /api/v2/user/profile/modal
    # Slip cost-center sources: the user's authorized budget departments, then the corp list.
    budget-dept-user: /api/v2/budgetdepartment/user/list/eacc/authorized/{corpUserId}
    budget-dept-corp: /api/v2/budgetdepartment/list
    # transport terminals/stations (id, vehicleType, name) for depart/arrival dropdowns
    etc-card-terminal: /api/v2/receipt/etc-card/terminal
    # public-transport NODES per vehicle: {nodeId, nodeName, vehicleType}. The OTHER locator
    # system - CBUS 2117 stops, KTX 347 stations, BUS 230, AIR 15 (TRAIN/SRT empty). Reference
    # data, so the gateway caches it; far too large to hand to an LLM, hence the search helper.
    vehicle-nodes: /api/v2/misc/public-api/nodes/{vehicleType}
    # personal-card general-expense browser (POST: startDate/endDate/approvalStatusTypeList/pageIndex/pageSize)
    general-expense: /api/v3/receipt/cloud/personal-card/my/general-expense
    # one receipt's full detail (NOT_ISSUED) / attach uploaded files to a receipt
    receipt-by-id: /api/v2/receipt/{receiptId}
    receipt-image: /api/v2/receipt/image/{receiptId}
    # plan region/route enrichment (docs/bstr-plan-save-api-guide.md): the country/city that
    # rides BSTR_PERIOD selections as selectionId, and the 이동경로 point/distance sources.
    region-list: /api/v2/bstr/area/region/{regionType}
    region-cities: /api/v2/bstr/area/region/city/{countryCode}
    region-used-list: /api/v2/bstr/area/region/used/{regionType}
    region-used-cities: /api/v2/bstr/area/region/used/CITY/{countryCode}
    region-by-id: /api/v2/bstr/area/region/id/{regionId}
    destination-list: /api/v2/bstr/destination/active/list
    misc-bypass: /api/v2/misc/bypass

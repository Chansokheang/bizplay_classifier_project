spring.application.name=bizplay_classifier_api

# Load environment variables from .env (relative to the working directory).
# OS env vars still take precedence; .env only supplies values that aren't
# already set, which then resolve the ${VAR:default} placeholders below.
spring.config.import=optional:file:./.env[.properties]

# MyBatis
mybatis.type-handlers-package=com.api.bizplay_classifier_api.config

# Disable Docker Compose auto-start (connecting to local PostgreSQL directly)
spring.docker.compose.enabled=false

# Do not auto-create Spring Session JDBC tables
spring.session.jdbc.initialize-schema=never

# jdbc datasource properties (PRIMARY, read-write; used by all JPA/MyBatis/app paths)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bizplay}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123}
spring.datasource.driver-class-name=org.postgresql.Driver

# Read-only datasource used ONLY by the conversational database-lookup sub-agent.
# Authenticates as the least-privilege `bizplay_agent_ro` role (see schemaV2.sql),
# which Postgres runs read-only with a 3s statement_timeout and SELECT granted only
# on the allow-listed lookup tables. This is what prevents the AI/agent from ever
# inserting/updating/deleting or calling procedures, without touching normal CRUD.
# Defaults point at the same local DB; override the role/password per environment.
app.conversational.agent-datasource.url=${APP_CONVERSATIONAL_AGENT_DATASOURCE_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bizplay}}
app.conversational.agent-datasource.username=${APP_CONVERSATIONAL_AGENT_DATASOURCE_USERNAME:bizplay_agent_ro}
app.conversational.agent-datasource.password=${APP_CONVERSATIONAL_AGENT_DATASOURCE_PASSWORD:agent_ro_change_me}
app.conversational.agent-datasource.driver-class-name=org.postgresql.Driver
app.conversational.agent-datasource.hikari.read-only=true
app.conversational.agent-datasource.hikari.maximum-pool-size=${APP_CONVERSATIONAL_AGENT_DATASOURCE_POOL_SIZE:3}
app.conversational.agent-datasource.hikari.pool-name=agent-ro-pool

# JPA / chatbot persistence
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway is available for the copied chatbot project, but this integrated app
# keeps using schemaV2.sql as the authoritative bootstrap script.
spring.flyway.enabled=false

# Spring AI / PGVector
spring.ai.openai.api-key=${SPRING_AI_OPENAI_API_KEY:not-used}
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=1024
spring.ai.vectorstore.pgvector.initialize-schema=false

# Base64-encoded AES key (16, 24, or 32 bytes after decoding)
app.encryption.base64-key=${APP_ENCRYPTION_BASE64_KEY:}

# Base64-encoded 32-byte HMAC key for JWT signing
app.jwt.base64-secret=${APP_JWT_BASE64_SECRET:,A#s5i=1n0Q.EVLSH,A!9)(lxtuOU+R@i3?]ZM,%^1W=}
app.auth.mode=${APP_AUTH_MODE:static}
app.auth.static-token=${APP_AUTH_STATIC_TOKEN:enabled}

# email properties
spring.mail.host=smtp.gmail.com
#spring.mail.port=587
spring.mail.username=heangs770@gmail.com
spring.mail.password=ovvi inxf gcmv wfzm
#spring.mail.properties.mail.smtp.auth=true
#spring.mail.properties.mail.smtp.starttls.enable=true
#spring.mail.properties.mail.smtp.starttls.required=true
#spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
#spring.mail.properties.mail.smtp.connectiontimeout=5000
#spring.mail.properties.mail.smtp.timeout=5000
#spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.port=465
spring.mail.properties.mail.smtp.ssl.enable=true

# multipart upload limits
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# allow larger Authorization/Cookie headers before Tomcat rejects request parsing
server.max-http-request-header-size=64KB

# Respect X-Forwarded-* headers from the HTTPS reverse proxy so Spring does not
# misclassify same-domain browser POSTs as cross-origin HTTP requests.
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:framework}

# Async request timeout (5 minutes for long-running AI operations)
spring.mvc.async.request-timeout=300000

# Tomcat connection timeout (5 minutes)
#server.connection-timeout=300000

# MinIO storage (S3-compatible local)
app.storage.minio.endpoint=${APP_STORAGE_MINIO_ENDPOINT:http://localhost:9000}
app.storage.minio.access-key=${APP_STORAGE_MINIO_ACCESS_KEY:minioadmin}
app.storage.minio.secret-key=${APP_STORAGE_MINIO_SECRET_KEY:minioadmin}
app.storage.minio.bucket=${APP_STORAGE_MINIO_BUCKET:bizplay-files}
app.storage.minio.request-folder=${APP_STORAGE_MINIO_REQUEST_FOLDER:request-files}
app.storage.minio.fail-fast=${APP_STORAGE_MINIO_FAIL_FAST:false}
app.storage.public-base-path=${APP_STORAGE_PUBLIC_BASE_PATH:/classifier/api/v1/storage/files}

# AI fallback for transaction classification (applies when rule-based match fails)
app.ai.fallback.enabled=${APP_AI_FALLBACK_ENABLED:true}
app.ai.fallback.url=${APP_AI_FALLBACK_URL:}
app.ai.fallback.api-key=${APP_AI_FALLBACK_API_KEY:}
app.ai.fallback.connect-timeout-ms=${APP_AI_FALLBACK_CONNECT_TIMEOUT_MS:5000}
app.ai.fallback.read-timeout-ms=${APP_AI_FALLBACK_READ_TIMEOUT_MS:60000}
app.ai.fallback.max-context-candidates=${APP_AI_FALLBACK_MAX_CONTEXT_CANDIDATES:40}
app.ai.fallback.openai.url=${APP_AI_FALLBACK_OPENAI_URL:https://api.openai.com/v1/chat/completions}
app.ai.fallback.gemini.url-template=${APP_AI_FALLBACK_GEMINI_URL_TEMPLATE:https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent}
app.ai.fallback.claude.url=${APP_AI_FALLBACK_CLAUDE_URL:https://api.anthropic.com/v1/messages}

